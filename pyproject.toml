[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peertorrent"
version = "1.0.0"
description = "A lightweight BitTorrent-inspired peer-to-peer file sharing system"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PeerTorrent Team" },
]
dependencies = [
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "black>=24.0",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py310"]
